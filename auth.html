<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Anonima23 - Authentification</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">anonima23</div>
        <div class="sidebar-toggle" id="sidebarToggle">
            <i class="fas fa-bars"></i>
        </div>
    </header>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Anonima23</h3>
            <button class="close-sidebar" id="closeSidebar">&times;</button>
        </div>
        <div class="sidebar-content">
            <div class="toggle-container">
                <span>Mode nuit</span>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <button class="sidebar-btn nav-form-btn" data-form="login">
                <i class="fas fa-sign-in-alt"></i> Connexion
            </button>
            <button class="sidebar-btn nav-form-btn" data-form="register">
                <i class="fas fa-user-plus"></i> Inscription
            </button>
            <button class="sidebar-btn nav-form-btn" data-form="reset">
                <i class="fas fa-key"></i> Mot de passe oublié
            </button>
            <hr>
            <button class="sidebar-btn" id="aboutBtn">
                <i class="fas fa-info-circle"></i> À propos
            </button>
            <button class="sidebar-btn" id="contactBtn">
                <i class="fas fa-envelope"></i> Contact
            </button>
            <button class="sidebar-btn" id="privacyBtn">
                <i class="fas fa-shield-alt"></i> Confidentialité
            </button>
        </div>
        <div class="sidebar-footer">
            <button class="install-btn" id="installBtn">
                <i class="fas fa-download"></i> Installer l'App
            </button>
        </div>
    </div>

    <!-- Overlay sidebar -->
    <div class="overlay" id="overlay"></div>

    <!-- Zone de notification entre header et formulaire -->
    <div id="notificationArea" class="notification-area"></div>

    <!-- Main content : 3 formulaires -->
    <main class="main-content">
        <!-- Connexion -->
        <div id="loginForm" class="form active">
            <h2>Connexion</h2>
            <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
            <input type="password" id="loginPassword" placeholder="Mot de passe" autocomplete="current-password">
            <div class="checkbox-container">
                <label>
                    <input type="checkbox" id="acceptPolicies"> J'accepte les politiques
                </label>
            </div>
            <a href="#" id="forgotPasswordLink" class="forgot-link">Mot de passe oublié ?</a>
            <button id="loginBtn" class="btn-primary">
                <span class="btn-text">Se connecter</span>
                <span class="btn-spinner" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
            </button>
        </div>

        <!-- Inscription -->
        <div id="registerForm" class="form">
            <h2>Inscription</h2>
            <input type="email" id="registerEmail" placeholder="Email" autocomplete="email">
            <input type="password" id="registerPassword" placeholder="Mot de passe" autocomplete="new-password">
            <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe">
            <button id="registerBtn" class="btn-primary">
                <span class="btn-text">S'inscrire</span>
                <span class="btn-spinner" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
            </button>
        </div>

        <!-- Mot de passe oublié -->
        <div id="resetForm" class="form">
            <h2>Réinitialiser mot de passe</h2>
            <input type="email" id="resetEmail" placeholder="Email" autocomplete="email">
            <button id="resetBtn" class="btn-primary">
                <span class="btn-text">Envoyer</span>
                <span class="btn-spinner" style="display:none;"><i class="fas fa-spinner fa-spin"></i></span>
            </button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth-nav.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
